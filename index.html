		<script>
            // Inisialisasi Synthesizer Suara menggunakan Tone.js
            let synth;
            function initTone() {
                if(!synth) {
                    synth = new Tone.Synth().toDestination();
                    Tone.start();
                }
            }
            function playSound(type) {
                if(muted) return;
                initTone();
                const now = Tone.now();
                if(type === 'click') {
                    synth.triggerAttackRelease("C5", "32n");
                } else if(type === 'reveal') {
                    synth.triggerAttackRelease("E5", "16n");
                } else if(type === 'correct') {
                    synth.triggerAttackRelease("G5", "8n", now);
                    synth.triggerAttackRelease("C6", "4n", now + 0.1);
                } else if(type === 'wrong') {
                    synth.triggerAttackRelease("Eb4", "8n", now);
                    synth.triggerAttackRelease("C4", "2n", now + 0.2);
                } else if(type === 'bad_special') {
                    synth.triggerAttackRelease("G3", "8n", now);
                    synth.triggerAttackRelease("C3", "2n", now + 0.2);
                } else if(type === 'good_special') {
                    synth.triggerAttackRelease("C5", "8n", now);
                    synth.triggerAttackRelease("E5", "8n", now + 0.1);
                    synth.triggerAttackRelease("G5", "4n", now + 0.2);
                } else if(type === 'gameover') {
                    synth.triggerAttackRelease("C5", "4n", now);
                    synth.triggerAttackRelease("E5", "4n", now + 0.2);
                    synth.triggerAttackRelease("G5", "4n", now + 0.4);
                    synth.triggerAttackRelease("C6", "1n", now + 0.6);
                }
            }

            // State game dinamis
            let teamCount = 2;
            let cardCount = 24;
            let activeTeam = 1;
            let scores = [0, 0, 0, 0, 0, 0];
            let teamNames = ['Tim 1', 'Tim 2', 'Tim 3', 'Tim 4', 'Tim 5', 'Tim 6'];
            let muted = false;
            let answeredCount = 0;

            function getActiveTeamName() { return teamNames[activeTeam - 1]; }
            function getNextTeam() { return (activeTeam % teamCount) + 1; }
            function getTeamName(team) { return teamNames[team - 1]; }
            
            function addScore(points) {
                scores[activeTeam - 1] += points;
                $(`#score-display-${activeTeam}`).text(scores[activeTeam - 1]);
            }
            
            function endTurn(cardId) {
                $('#square-' + cardId).addClass('answered').attr('onclick', '');
                
                $(`#team-box-${activeTeam}`).removeClass('score-container-intro');
                activeTeam = (activeTeam % teamCount) + 1;
                $(`#team-box-${activeTeam}`).addClass('score-container-intro');
                
                answeredCount++;
                if(answeredCount >= cardCount) {
                    setTimeout(() => {
                        let maxScore = Math.max(...scores.slice(0, teamCount));
                        let winners = [];
                        for(let i = 0; i < teamCount; i++) {
                            if(scores[i] === maxScore) winners.push(teamNames[i]);
                        }
                        
                        let isDraw = winners.length > 1;
                        let winnerText = isDraw ? "Permainan Seri!" : "Horee! Pemenangnya:";
                        
                        $('#winner-heading').text(winnerText);
                        $('#winner-names-display').text(winners.join(" & "));
                        $('#winner-score-display').text(`Skor: ${maxScore}`);
                        
                        playSound('gameover');
                        triggerConfetti();
                        
                        $('#winner-modal').modal('show');
                    }, 1000);
                }
            }

            function triggerConfetti() {
                var duration = 4 * 1000;
                var animationEnd = Date.now() + duration;
                var defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 9999 };

                function randomInRange(min, max) { return Math.random() * (max - min) + min; }

                var interval = setInterval(function() {
                    var timeLeft = animationEnd - Date.now();
                    if (timeLeft <= 0) { return clearInterval(interval); }
                    var particleCount = 50 * (timeLeft / duration);
                    confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 } }));
                    confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 } }));
                }, 250);
            }
            
            function shark(pts) { addScore(-pts); } 
            
            function lifesaver(pts) {
                if (teamCount > 1) {
                    let targetTeam = getNextTeam();
                    scores[targetTeam - 1] += pts;
                    $(`#score-display-${targetTeam}`).text(scores[targetTeam - 1]);
                } else {
                    addScore(-pts); 
                }
            }
		</script>

        <script>
            function renderTeamInputs() {
                let html = '';
                for(let i = 1; i <= parseInt($('#team-count-select').val()); i++) {
                    html += `
                    <div class="row" style="margin-bottom:10px;">
                        <div class="col-xs-8">
                            <div class="team-label ${i===1?'':'hidden'}"><label>Nama</label></div>
                            <input class="form-control my-input" type="text" value="${teamNames[i-1]}" id="team-input-${i}" maxlength="19" style="border-radius: 10px;" />
                        </div>
                        <div class="col-xs-4">
                            <div class="team-label ${i===1?'':'hidden'}"><label>Skor</label></div>
                            <input class="form-control score-input my-input" type="number" id="score-input-${i}" value="${scores[i-1]}" style="border-radius: 10px;" /> 
                        </div>
                    </div>`;
                }
                $('#team-inputs-container').html(html);
            }
            
            function changeTeamCount(val) { renderTeamInputs(); }

            function saveTeamsAndRestart() {
                teamCount = parseInt($('#team-count-select').val());
                for(let i = 1; i <= teamCount; i++) {
                    teamNames[i-1] = $(`#team-input-${i}`).val() || `Tim ${i}`;
                    scores[i-1] = parseInt($(`#score-input-${i}`).val()) || 0;
                }
                for(let i = teamCount; i < 6; i++) { scores[i] = 0; }
                generateGame();
            }
            
            $(document).ready(function() {
                $('#team-count-select').val(teamCount);
                renderTeamInputs();
                renderScoreboardUI();
            });
        </script>

        <script>
            const defaultQuestions = [
                {q: "Apa nama planet terbesar di tata surya kita?", a: "Yupiter"},

                {q: "1 kilometer sama dengan berapa meter?", a: "1000 meter"},
                {q: "Apakah organ pernapasan utama pada ikan?", a: "Insang"},
                {q: "Siapakah pencipta lagu kebangsaan Indonesia Raya?", a: "W.R. Supratman"},

                {q: "Apa nama senjata tradisional khas dari Jawa Barat?", a: "Kujang"},
                {q: "Mata uang negara Korea Selatan adalah?", a: "Won"},
                {q: "Berapakah hasil dari 100 dibagi 4?", a: "25"},
                {q: "Provinsi apakah yang letaknya paling timur di Indonesia?", a: "Papua"}
            ];

            let customWords = null; // Tempat menyimpan soal yang di-generate

            async function generateQuestionsFromAI() {
                const input = document.getElementById('ai-prompt-input');
                const topic = input.value.trim();
                if (!topic) {
                    alert("Silakan masukkan topik untuk di-generate AI.");
                    input.focus();
                    return;
                }

                const btn = document.getElementById('btn-generate-ai');
                btn.innerHTML = '<i class="fa fa-spinner fa-spin"></i> Membuat Soal...';
                btn.disabled = true;

                // Hitung kebutuhan soal (maksimal 20 untuk 24 kotak)
                let currentCardCount = parseInt(document.getElementById('box-count-select').value);
                let numQuestions = currentCardCount === 8 ? 6 : (currentCardCount === 16 ? 12 : 20);

                try {
                    const response = await fetch('/api/generate-questions', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ topic, count: numQuestions })
                    });
                    
                    const result = await response.json();
                    
                    if (!response.ok) {
                        throw new Error(result.error || `Server error (${response.status})`);
                    }
                    
                    if (result.questions && Array.isArray(result.questions) && result.questions.length > 0) {
                        customWords = result.questions;
                        alert(`Berhasil membuat ${customWords.length} pertanyaan tentang "${topic}"! Game telah diperbarui.`);
                        generateGame(); 
                    } else {
                        alert("Gagal membuat pertanyaan. AI tidak merespon dengan benar.");
                    }
                } catch (error) {
                    console.error("Error generating AI content:", error);
                    alert("Gagal menghasilkan soal: " + (error.message || "Terjadi kesalahan koneksi ke server AI."));
                } finally {
                    btn.innerHTML = '<i class="fa fa-magic"></i> Generate AI';
                    btn.disabled = false;
                }
            }

            function shuffle(array) {
                for (let i = array.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [array[i], array[j]] = [array[j], array[i]];
                }
                return array;
            }

            function generateGame() {
                cardCount = parseInt(document.getElementById('box-count-select').value);
                
                let words = [];
                if (customWords && customWords.length > 0) {
                    words = [...customWords];
                } else {
                    words = [...defaultQuestions];
                }

                shuffle(words);
                
                let numSpecials = cardCount === 8 ? 2 : 4;
                let numWords = cardCount - numSpecials;

                if(words.length === 0) {
                    alert("Data soal kosong, permainan gagal dimuat.");
                    return;
                }
                while (words.length > 0 && words.length < numWords) {
                    words = words.concat(words);
                }
                
                let selectedWords = words.slice(0, numWords);
                let cards = selectedWords.map(w => { return { type: 'question', data: { q: w.q, a: w.a } }; });

                if (cardCount === 8) {
                    cards.push({ type: 'trap' }, { type: 'gift' }); 
                } else {
                    cards.push({ type: 'trap' }, { type: 'shark' }, { type: 'gift' }, { type: 'thief' });
                }
                
                shuffle(cards);

                let gridHtml = '';
                let modalsHtml = '';
                let cols = cardCount === 24 ? 6 : 4; 

                const dynamicGrid = document.getElementById('dynamic-grid');
                if (cardCount === 24) {
                    dynamicGrid.style.gridTemplateColumns = 'repeat(6, 1fr)';
                    dynamicGrid.style.gridTemplateRows = 'repeat(4, 1fr)';
                } else if (cardCount === 16) {
                    dynamicGrid.style.gridTemplateColumns = 'repeat(4, 1fr)';
                    dynamicGrid.style.gridTemplateRows = 'repeat(4, 1fr)';
                } else if (cardCount === 8) {
                    dynamicGrid.style.gridTemplateColumns = 'repeat(4, 1fr)';
                    dynamicGrid.style.gridTemplateRows = 'repeat(2, 1fr)';
                }

                for(let i = 0; i < cardCount; i++) {
                    let r = Math.floor(i / cols);
                    let c = i % cols;
                    let id = i + 1;
                    let btnClass = (r + c) % 2 === 0 ? 'btn-light' : 'btn-dark';
                    let card = cards[i];
                    
                    let numFontSize = cardCount === 8 ? '12vmin' : (cardCount === 16 ? '8vmin' : '6vmin');

                    gridHtml += `
                    <div class="grid-square ${btnClass} animated bounceInDown" style="animation-delay: ${i*0.02}s" data-target="#modal${id}" data-toggle="modal" id="square-${id}" onclick="playSound('click')">
                        <div class="squareNumber" id="squareNumber-${id}" style="font-size: ${numFontSize};">${id}</div>
                    </div>`;

                    if (card.type === 'question') {
                        modalsHtml += buildQuestionModal(id, card.data);
                    } else {
                        modalsHtml += buildSpecialModal(id, card.type);
                    }
                }

                document.getElementById('dynamic-grid').innerHTML = gridHtml;
                document.getElementById('dynamic-modals').innerHTML = modalsHtml;

                answeredCount = 0;
                activeTeam = 1;
                renderScoreboardUI();
            }

            function buildQuestionModal(id, data) {
                return `
                <div class="modal fade question-type modal-card" id="modal${id}" tabindex="-1" data-backdrop="static">
                    <div class="modal-dialog modal-dialog-100">
                        <div class="modal-content text-center">
                            <div class="panel panel-primary box-shadow--4dp">
                                <div class="panel-heading">
                                    <div class="modal-name modal-name-points">15 Poin</div>
                                    <button class="close closeBig" data-dismiss="modal" type="button" onclick="playSound('click')" style="color: white; opacity: 0.8;">&times;</button>
                                </div>
                                <div class="panel-body">
                                    <div class="modal-problem modal-text" style="font-size: 5.5vh; font-weight: bold; padding: 40px 20px; line-height: 1.4; color: #2c3e50;" contenteditable="false">${data.q}</div>
                                </div>
                            </div>
                            <div id="solution-${id}" class="panel panel-answer box-shadow--4dp hidden" style="margin-top: 20px; padding: 25px;">
                                <div class="modal-solution modal-text" style="font-size: 4.5vh; font-weight: bold; color: #1e3c72;" contenteditable="false">${data.a}</div>
                            </div>
                            <div class="question-controls">
                                <div class="modal-controls text-center no-select">
                                    <!-- Tombol Salah (Awalnya Hilang) -->
                                    <button class="btn btn-oops btn-control no-select" id="btn-salah-${id}" style="display: none;" data-dismiss="modal" onclick="doOops(${id})">
                                        <i class="fa fa-times"></i>&nbsp;&nbsp;Salah!
                                    </button>
                                    
                                    <!-- Tombol Cek (Awalnya Muncul) -->
                                    <button class="btn btn-check btn-control no-select" id="check-${id}" onclick="doCheck(${id})">
                                        <i class="fa fa-search"></i>&nbsp;&nbsp;Cek Jawaban
                                    </button> 
                                    
                                    <!-- Tombol Benar (Awalnya Hilang) -->
                                    <button class="btn btn-okay btn-control no-select" id="btn-benar-${id}" style="display: none;" data-dismiss="modal" onclick="doOkay(${id})">
                                        <i class="fa fa-check"></i>&nbsp;&nbsp;Benar!
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>`;
            }

            function buildSpecialModal(id, type) {
                let imgUrl = `https://media.baamboozle.com/bbzl-prod-eu-west-5/img/power-ups/${type}.png`;
                let headingClass = (type === 'trap' || type === 'thief') ? 'special-hdr-oops' : 'special-hdr-ok';
                let instruction = '';
                let buttons = '';

                if (type === 'trap') {
                    instruction = "Yah, ZONK! Tidak ada poin!";
                    buttons = `<button class="btn btn-oops btn-control no-select" data-dismiss="modal" onclick="doTrap(${id})"><i class="fa fa-times"></i>&nbsp;&nbsp;Lanjut</button>`;
                } else if (type === 'shark') {
                    instruction = "Aduh! Kehilangan 20 poin!";
                    buttons = `<button class="btn btn-okay btn-control no-select" data-dismiss="modal" onclick="doShark(${id})"><i class="fa fa-check"></i>&nbsp;&nbsp;Oke</button>`;
                } else if (type === 'gift') {
                    instruction = "Mantap! Mendapat bonus 25 poin!";
                    buttons = `<button class="btn btn-okay btn-control no-select" data-dismiss="modal" onclick="doGift(${id})"><i class="fa fa-star"></i>&nbsp;&nbsp;Ambil!</button>`;
                } else if (type === 'thief') {
                    instruction = "Pilih untuk memberikan poin ke tim lawan:";
                    buttons = `
                        <button class="btn btn-oops btn-control no-select" data-dismiss="modal" onclick="doThief(${id}, 5)">5 Poin</button>
                        <button class="btn btn-oops btn-control no-select" data-dismiss="modal" onclick="doThief(${id}, 15)">15 Poin</button>
                        <button class="btn btn-oops btn-control no-select" data-dismiss="modal" onclick="doThief(${id}, 25)">25 Poin</button>
                    `;
                }

                return `
                <div class="modal fade special-type modal-card" id="modal${id}" tabindex="-1" data-backdrop="static">
                    <div class="modal-dialog modal-dialog-100">
                        <div class="modal-content">
                            <div class="panel panel-primary box-shadow--4dp">
                                <div class="panel-heading text-center ${headingClass}">
                                    <button class="close closeBig" data-dismiss="modal" type="button" onclick="playSound('click')" style="color: white; opacity: 0.8;">&times;</button>
                                    <div class="modal-name">&nbsp;</div>
                                </div>
                                <div class="panel-body text-center modal-text-small">
                                    <img class="game-image modal-power-image img-responsive center-block" src="${imgUrl}" draggable="false" style="max-height: 250px;">
                                </div>
                            </div>
                            <div class="panel panel-instruction panel-special box-shadow--4dp text-center modal-text" style="font-size: 30px; font-weight: bold; margin-top: 15px; padding: 20px;">
                                <div class="panel-body">
                                    <div class="modal-instruction">${instruction}</div>
                                </div>
                            </div>
                            <div class="modal-controls text-center">${buttons}</div> 
                        </div>
                    </div>
                </div>`;
            }

            function doCheck(id) {
                playSound('reveal');
                // Sembunyikan tombol cek
                $(`#check-${id}`).hide();
                // Munculkan tombol Salah dan Benar dengan mengubah display ke inline-flex
                $(`#btn-salah-${id}`).css("display", "inline-flex").addClass("animated fadeInLeft faster");
                $(`#btn-benar-${id}`).css("display", "inline-flex").addClass("animated fadeInRight faster");
                // Munculkan panel jawaban
                $(`#solution-${id}`).removeClass("hidden").css('visibility', 'visible').addClass("animated fadeInUp faster");
            }

            function doOkay(id) {
                playSound('correct');
                addScore(15);
                endTurn(id);
            }

            function doOops(id) {
                playSound('wrong');
                $(`#squareNumber-${id}`).text("X");
                endTurn(id);
            }

            function doTrap(id) {
                playSound('bad_special');
                addScore(0);
                endTurn(id);
            }

            function doShark(id) {
                playSound('bad_special');
                shark(20);
                endTurn(id);
            }

            function doGift(id) {
                playSound('good_special');
                addScore(25);
                endTurn(id);
            }

            function doThief(id, points) {
                playSound('bad_special');
                lifesaver(points);
                endTurn(id);
            }

            window.onload = function() {
                generateGame();
            };
        </script>
	</body>
</html>
